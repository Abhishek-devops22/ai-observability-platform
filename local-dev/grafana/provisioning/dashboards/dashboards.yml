apiVersion: 1

providers:
  - name: ai-observability-platform
    orgId: 1
    folder: "AI Observability Platform"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
