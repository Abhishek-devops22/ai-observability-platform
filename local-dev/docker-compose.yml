# Local Prometheus + Grafana for Path A (local dev) — no Kubernetes
# cluster required. See ../README.md "Quick start".
#
# Start:  cd local-dev && docker compose up -d
# Stop:   cd local-dev && docker compose down
#
# NOTE: the pre-built dashboards under ../dashboards/ were designed for
# the full cluster deploy (Path B) — they expect metrics from
# kube-state-metrics, cAdvisor, the OTel Collector, and the AI engine
# (ai_* series). The mock-exporter service below fakes those series (see
# mock-exporter/exporter.py) purely so the dashboards have something to
# render locally — it is local-dev-only scaffolding, not part of the
# platform. Two panels (Top Error Logs, Similar Historical Incidents) use
# a Loki datasource that isn't stood up here, so they'll stay empty.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-obs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ai-obs-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  mock-exporter:
    build: ./mock-exporter
    container_name: ai-obs-mock-exporter
    ports:
      - "9101:9101"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ai-obs-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
