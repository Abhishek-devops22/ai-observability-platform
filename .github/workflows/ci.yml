name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mcp-server/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  ai-engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libomp-dev
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infrastructure/
      - name: validate root stack
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: validate backend bootstrap stack
        working-directory: infrastructure/backend
        run: |
          terraform init -input=false
          terraform validate

  kubernetes-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: validate YAML syntax
        run: |
          python3 -c "
          import yaml, glob, sys
          failed = False
          for f in glob.glob('kubernetes/**/*.yaml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  print(f'FAIL {f}: {e}')
                  failed = True
          sys.exit(1 if failed else 0)
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: [mcp-server-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build mcp-server image (no push)
        uses: docker/build-push-action@v6
        with:
          context: mcp-server
          push: false
          tags: ai-observability-mcp-server:ci
