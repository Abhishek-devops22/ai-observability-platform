# Helm values for grafana/loki, deployed in SimpleScalable mode.
#
# helm repo add grafana https://grafana.github.io/helm-charts
# helm upgrade --install loki grafana/loki -n observability -f values.yaml

deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 2
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 336h # 14 days
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32

write:
  replicas: 2
  persistence:
    storageClass: gp3
    size: 20Gi

read:
  replicas: 2
  persistence:
    storageClass: gp3
    size: 20Gi

backend:
  replicas: 2
  persistence:
    storageClass: gp3
    size: 20Gi

gateway:
  enabled: true

minio:
  enabled: false # swap to true / an S3 bucket for production retention beyond a few days

test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
